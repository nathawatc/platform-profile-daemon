name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      # ruff and rumdl are pinned to the versions the checks were written
      # against; bump them together with any new findings.
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
          pipx install ruff==0.17.3
          pipx install rumdl==0.2.78

      - name: Lint (zig fmt, shellcheck, shfmt, ruff, rumdl)
        run: bash tools/lint.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Install smoke-test dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus-daemon python3-gi gir1.2-glib-2.0 util-linux

      # Ubuntu runners restrict unprivileged user namespaces, which the init
      # and isolated D-Bus smoke tests rely on.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Unit tests (Debug, includes zig fmt check)
        run: zig build test

      - name: Unit tests (ReleaseFast)
        run: zig build test -Doptimize=ReleaseFast

      - name: Build shipped binaries
        run: |
          zig build
          zig build --prefix "$RUNNER_TEMP/stage"

      - name: Install layout, binary separation and size budget
        run: |
          bash tools/check-install.sh "$RUNNER_TEMP/stage"
          bash tools/check-size.sh "$RUNNER_TEMP/stage"
          bash tools/check-units.sh

      - name: Init helper smoke test
        run: bash tools/init-smoke.sh "$RUNNER_TEMP/stage/lib/platform-profile-daemon-init"

      - name: Captured-frame corpus is intact
        run: python3 tools/capture-corpus.py --verify

      - name: Isolated D-Bus smoke test
        run: unshare --user --map-root-user python3 tools/dbus-isolated-smoke.py
